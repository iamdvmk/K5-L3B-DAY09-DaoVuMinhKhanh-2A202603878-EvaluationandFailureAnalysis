# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every mechanism of the public pack already has a row in the taxonomy.
ticket_over_db: FM-03          # ticket (or injected "[SYSTEM]" text) overrides DB facts
stale_policy: FM-06            # superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # sum the matching clauses instead of taking the largest
double_deduct: FM-05           # prior refund deducted by the agent AND by the host
sibling_refund: FM-07          # "gom đơn": refund other claims on the same order
denied_ignored: FM-02          # policy/approval denial ignored, reply says resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # acting on another principal's order / data
